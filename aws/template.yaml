AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: NAMES UNIBEN election API; deploy only after independent approval and testing.
Parameters:
  FrontendOrigin:
    Type: String
    Description: Frontend website origin without path or trailing slash, for CORS
  FrontendUrl:
    Type: String
    Description: Exact voter website URL including final slash (e.g. https://your-app.amplifyapp.com/)
  GoogleOAuthSecretArn:
    Type: String
    Description: Existing Secrets Manager ARN, JSON object with clientId and clientSecret
  OtpPepperSecretArn:
    Type: String
    Description: Existing Secrets Manager ARN, JSON object with pepper
  SesFromEmail:
    Type: String
    Description: SES verified FROM email. SES production access must be approved.
  SesIdentityArn:
    Type: String
    Description: SES verified identity ARN for least-privilege email sending
  AdminDomainPrefix:
    Type: String
    MinLength: 8
    MaxLength: 63
    AllowedPattern: '[a-z0-9-]+'
    Description: Globally unique Cognito hosted-login prefix for authenticated ELECO management
Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 15
Resources:
  ElectionHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      Auth:
        Authorizers:
          ElectionManagersJwt:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${AdminUserPool}'
              audience: [!Ref AdminUserPoolClient]
      DefaultRouteSettings:
        ThrottlingBurstLimit: 120
        ThrottlingRateLimit: 60
      CorsConfiguration:
        AllowOrigins: [!Ref FrontendOrigin]
        AllowMethods: ['GET','POST','PUT','OPTIONS']
        AllowHeaders: ['Content-Type','Authorization']
        MaxAge: 3600
  AdminUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-eleco-admin'
      UserPoolTier: LITE
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      MfaConfiguration: 'ON'
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      SoftwareTokenMfaConfiguration:
        Enabled: true
      Policies:
        PasswordPolicy:
          MinimumLength: 14
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
  AdminUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref AdminUserPool
      ClientName: names-eleco-admin-web
      GenerateSecret: false
      SupportedIdentityProviders: [COGNITO]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid,email]
      CallbackURLs: [!Ref FrontendUrl]
      LogoutURLs: [!Ref FrontendUrl]
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      TokenValidityUnits: { AccessToken: minutes }
  AdminUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref AdminDomainPrefix
      ManagedLoginVersion: 1
      UserPoolId: !Ref AdminUserPool
  ElectionManagersGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref AdminUserPool
      GroupName: ElectionManagers
      Description: Approved users who may manage election candidate drafts
  AdminAuditTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      AttributeDefinitions: [{ AttributeName: eventId, AttributeType: S }]
      KeySchema: [{ AttributeName: eventId, KeyType: HASH }]
  VotersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
        - { AttributeName: institutionalEmail, AttributeType: S }
      KeySchema: [{ AttributeName: id, KeyType: HASH }]
      GlobalSecondaryIndexes:
        - IndexName: EmailIndex
          KeySchema: [{ AttributeName: institutionalEmail, KeyType: HASH }]
          Projection: { ProjectionType: ALL }
  BallotsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      AttributeDefinitions: [{ AttributeName: ballotId, AttributeType: S }]
      KeySchema: [{ AttributeName: ballotId, KeyType: HASH }]
  EphemeralTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: key, AttributeType: S }]
      KeySchema: [{ AttributeName: key, KeyType: HASH }]
      TimeToLiveSpecification: { AttributeName: expiresAt, Enabled: true }
  ElectionConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      AttributeDefinitions: [{ AttributeName: id, AttributeType: S }]
      KeySchema: [{ AttributeName: id, KeyType: HASH }]
  PublishedResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      AttributeDefinitions: [{ AttributeName: id, AttributeType: S }]
      KeySchema: [{ AttributeName: id, KeyType: HASH }]
  ElectionApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handler.handler
      Environment:
        Variables:
          VOTERS_TABLE: !Ref VotersTable
          BALLOTS_TABLE: !Ref BallotsTable
          EPHEMERAL_TABLE: !Ref EphemeralTable
          CONFIG_TABLE: !Ref ElectionConfigTable
          PUBLICATION_TABLE: !Ref PublishedResultsTable
          FRONTEND_URL: !Ref FrontendUrl
          FRONTEND_ORIGIN: !Ref FrontendOrigin
          GOOGLE_OAUTH_SECRET_ARN: !Ref GoogleOAuthSecretArn
          OTP_PEPPER_SECRET_ARN: !Ref OtpPepperSecretArn
          SES_FROM_EMAIL: !Ref SesFromEmail
          API_URL: !Sub 'https://${ElectionHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:UpdateItem, dynamodb:TransactWriteItems]
              Resource: [!GetAtt VotersTable.Arn, !Sub '${VotersTable.Arn}/index/EmailIndex']
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:TransactWriteItems]
              Resource: !GetAtt BallotsTable.Arn
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem]
              Resource: !GetAtt EphemeralTable.Arn
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:BatchGetItem, dynamodb:TransactWriteItems]
              Resource: !GetAtt ElectionConfigTable.Arn
            - Effect: Allow
              Action: [dynamodb:GetItem]
              Resource: !GetAtt PublishedResultsTable.Arn
            - Effect: Allow
              Action: [secretsmanager:GetSecretValue]
              Resource: [!Ref GoogleOAuthSecretArn, !Ref OtpPepperSecretArn]
            - Effect: Allow
              Action: [ses:SendEmail]
              Resource: !Ref SesIdentityArn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref ElectionHttpApi
            Path: /{proxy+}
            Method: ANY
  AdminCandidatesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/admin.handler
      MemorySize: 256
      Timeout: 12
      Environment:
        Variables:
          CONFIG_TABLE: !Ref ElectionConfigTable
          ADMIN_AUDIT_TABLE: !Ref AdminAuditTable
          FRONTEND_ORIGIN: !Ref FrontendOrigin
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:ConditionCheckItem, dynamodb:TransactWriteItems]
              Resource: !GetAtt ElectionConfigTable.Arn
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:TransactWriteItems]
              Resource: !GetAtt AdminAuditTable.Arn
      Events:
        AdminRead:
          Type: HttpApi
          Properties:
            ApiId: !Ref ElectionHttpApi
            Path: /admin/candidates
            Method: GET
            Auth:
              Authorizer: ElectionManagersJwt
        AdminWrite:
          Type: HttpApi
          Properties:
            ApiId: !Ref ElectionHttpApi
            Path: /admin/candidates
            Method: PUT
            Auth:
              Authorizer: ElectionManagersJwt
  ProvisionalResultsPublisher:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/publish.handler
      Timeout: 90
      MemorySize: 512
      Environment:
        Variables:
          VOTERS_TABLE: !Ref VotersTable
          BALLOTS_TABLE: !Ref BallotsTable
          CONFIG_TABLE: !Ref ElectionConfigTable
          PUBLICATION_TABLE: !Ref PublishedResultsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:BatchGetItem]
              Resource: !GetAtt ElectionConfigTable.Arn
            - Effect: Allow
              Action: [dynamodb:Scan]
              Resource: [!GetAtt VotersTable.Arn, !GetAtt BallotsTable.Arn]
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem]
              Resource: !GetAtt PublishedResultsTable.Arn
      Events:
        PeriodicPublicationCheck:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Enabled: true
            Description: Check for a closed and reconciled election before publishing provisional public totals.
Outputs:
  ApiUrl: { Value: !Sub 'https://${ElectionHttpApi}.execute-api.${AWS::Region}.amazonaws.com' }
  VotersTableName: { Value: !Ref VotersTable }
  ConfigTableName: { Value: !Ref ElectionConfigTable }
  BallotsTableName: { Value: !Ref BallotsTable }
  EphemeralTableName: { Value: !Ref EphemeralTable }
  PublishedResultsTableName: { Value: !Ref PublishedResultsTable }
  AdminUserPoolId: { Value: !Ref AdminUserPool }
  AdminAppClientId: { Value: !Ref AdminUserPoolClient }
  AdminCognitoDomain: { Value: !Sub 'https://${AdminDomainPrefix}.auth.${AWS::Region}.amazoncognito.com' }
  AdminAuditTableName: { Value: !Ref AdminAuditTable }
